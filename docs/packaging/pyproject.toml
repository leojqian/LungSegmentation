[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lungmap"
version = "0.1.0"
description = "Diaphragm geometry from chest X-ray lung masks"
readme = "lungmap/README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lungmap"]
